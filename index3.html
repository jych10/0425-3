<!DOCTYPE html>

    <style>
        :root {
            --blood-red: #8b0000;
            --vein-blue: #001f3f;
            --nerve-gold: #ffd700;
            --cell-green: #44ff44;
        }

        body {
            margin: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 頂部狀態列 */
        #stat-bar {
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid var(--blood-red);
            z-index: 10;
        }
        .stat-item { text-align: center; font-weight: bold; }
        .value { display: block; font-size: 1.2em; color: var(--nerve-gold); }

        /* 3D 舞台 */
        #game-viewport {
            position: relative;
            width: 100vw;
            height: 80vh;
            background: #000;
        }

        #renderer {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 答題浮層 */
        #interaction-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: rgba(10, 10, 10, 0.85);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid var(--vein-blue);
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 0 30px rgba(0, 31, 63, 0.5);
            display: none;
        }

        .question { font-size: 1.1em; margin-bottom: 15px; color: #fff; line-height: 1.4; }
        .options { display: grid; grid-template-columns: 1fr; gap: 8px; }
        
        button {
            padding: 12px;
            background: rgba(50, 50, 50, 0.5);
            color: white;
            border: 1px solid var(--nerve-gold);
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
        }
        button:hover:not(:disabled) { background: var(--nerve-gold); color: black; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        #msg { margin-top: 10px; font-weight: bold; min-height: 1.2em; }

        /* 啟動與結算畫面 */
        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #220000 0%, #000 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
            text-align: center;
        }

        /* 畫面搖晃動畫 (答錯用) */
        .shake { animation: shakeEffect 0.5s; }
        @keyframes shakeEffect {
            0% { transform: translate(0,0); }
            25% { transform: translate(5px, 5px); }
            50% { transform: translate(-5px, -5px); }
            75% { transform: translate(5px, -5px); }
            100% { transform: translate(0,0); }
        }
    </style>
</head>

    // --- 3D 渲染邏輯 ---
    const canvas = document.getElementById('renderer');
    const ctx = canvas.getContext('2d');
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight * 0.8;
    }
    window.addEventListener('resize', resize);
    resize();

    function draw3D() {
        if(!gameState.active) return;
        
        // 平滑移動相機
        gameState.cameraZ += (gameState.targetZ - gameState.cameraZ) * 0.1;
        
        const w = canvas.width;
        const h = canvas.height;
        ctx.fillStyle = '#050000'; // 背景色
        ctx.fillRect(0,0,w,h);

        // 渲染地平線與天花板
        const grd = ctx.createLinearGradient(0, 0, 0, h);
        grd.addColorStop(0, "#200");
        grd.addColorStop(0.5, "#000");
        grd.addColorStop(1, "#200");
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, w, h);

        // 模擬牆面 (Raycasting 簡化版)
        const wallCount = 12;
        const spacing = 150;
        
        for(let i = wallCount; i >= 0; i--) {
            const z = ((i * spacing) - (gameState.cameraZ % spacing));
            const size = (h / (z / 200));
            const xOffset = Math.sin(gameState.cameraZ * 0.005) * 50; // 微晃動感

            if(z > 0) {
                const alpha = Math.min(1, 400 / z);
                ctx.strokeStyle = `rgba(139, 0, 0, ${alpha})`;
                ctx.lineWidth = 2;
                
                // 畫方框牆面 (神經網絡感)
                ctx.strokeRect(w/2 - size/2 + xOffset, h/2 - size/2, size, size);
                
                // 畫連接線 (血管感)
                ctx.beginPath();
                ctx.moveTo(w/2 - size/2 + xOffset, h/2 - size/2);
                ctx.lineTo(0,0);
                ctx.moveTo(w/2 + size/2 + xOffset, h/2 - size/2);
                ctx.lineTo(w,0);
                ctx.stroke();
            }
        }
        
        requestAnimationFrame(draw3D);
    }

    // --- 遊戲邏輯 ---
    function startGame() {
        document.getElementById('menu-overlay').style.display = 'none';
        document.getElementById('interaction-overlay').style.display = 'block';
        gameState.active = true;
        gameState.stamina = 100;
        gameState.currentStep = 0;
        gameState.cameraZ = 0;
        gameState.targetZ = 0;
        updateUI();
        showQuestion();
        draw3D();
    }

    function showQuestion() {
        if(!gameState.active) return;
        const randomIndex = Math.floor(Math.random() * questions.length);
        const qData = questions[randomIndex];

        const qBox = document.getElementById('q-text');
        const optContainer = document.getElementById('q-options');
        const msg = document.getElementById('msg');
        
        msg.innerText = "";
        qBox.innerText = `[關卡 ${gameState.currentStep + 1}] ${qData.q}`;
        optContainer.innerHTML = '';
        
        qData.a.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, qData.correct);
            optContainer.appendChild(btn);
        });
    }

    function checkAnswer(chosen, correct) {
        const btns = document.querySelectorAll('#q-options button');
        btns.forEach(b => b.disabled = true);
        const msg = document.getElementById('msg');

        if(chosen === correct) {
            msg.innerHTML = "<span style='color:var(--cell-green)'>✔ 生理回穩，成功突圍！</span>";
            gameState.currentStep++;
            gameState.targetZ += 300; // 3D 移動
        } else {
            msg.innerHTML = "<span style='color:var(--blood-red)'>❌ 系統受損！細胞活性下降。</span>";
            gameState.stamina -= 20;
            document.body.classList.add('shake');
            setTimeout(() => document.body.classList.remove('shake'), 500);
        }

        updateUI();

        setTimeout(() => {
            if(gameState.stamina <= 0) return endGame(false);
            if(gameState.currentStep >= gameState.totalSteps) return endGame(true);
            showQuestion();
        }, 1200);
    }

    function updateUI() {
        document.getElementById('stamina').innerText = gameState.stamina;
        document.getElementById('steps').innerText = `${gameState.currentStep} / ${gameState.totalSteps}`;
        document.getElementById('depth').innerText = `${gameState.currentStep * 50}m`;
    }

    function endGame(isWin) {
        gameState.active = false;
        const menu = document.getElementById('menu-overlay');
        menu.style.display = 'flex';
        document.getElementById('interaction-overlay').style.display = 'none';

        if(isWin) {
            menu.innerHTML = `
                <h1 style="color:var(--cell-green)">逃生成功！</h1>
                <p>你已突破 3D 人體迷宮，健康素養評定：優等。</p>
                <button onclick="location.reload()" style="padding:15px 40px; background:var(--cell-green); color:black; border:none; cursor:pointer;">再次挑戰</button>
            `;
        } else {
            menu.innerHTML = `
                <h1 style="color:var(--blood-red)">細胞凋亡...</h1>
                <p>體力歸零，意識消失在迷宮深處。</p>
                <button onclick="location.reload()" style="padding:15px 40px; background:white; color:black; border:none; cursor:pointer;">重新修復</button>
            `;
        }
    }
</script>

</body>
</html>
